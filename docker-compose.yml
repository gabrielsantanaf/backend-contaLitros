services:
  postgres:
    image: postgres:16-alpine
    container_name: contalitro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-contalitro}
      POSTGRES_USER: ${DB_USER:-contalitro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contalitro}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: contalitro-backend:latest
    container_name: contalitro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-contalitro}
      DB_USER: ${DB_USER:-contalitro}
      DB_PASSWORD: ${DB_PASSWORD:-contalitro}
      TZ: UTC
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
