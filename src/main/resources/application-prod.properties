# Perfil prod: PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:contalitro}
spring.datasource.username=${DB_USER:contalitro}
spring.datasource.password=${DB_PASSWORD:contalitro}

spring.h2.console.enabled=false

# Em prod o veiculo precisa ser cadastrado pela API antes de o equipamento enviar dados
contalitro.auto-cadastro=${AUTO_CADASTRO:false}
