spring.application.name=backend-contaLitros

# Perfil padrao: H2 em memoria (modo PostgreSQL) para desenvolvimento e testes
spring.datasource.url=jdbc:h2:mem:contalitro;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# O Flyway e o dono do esquema; o Hibernate so valida
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Conta Litro
# Auto-cadastro: equipamento desconhecido vira veiculo na primeira mensagem (desligado em prod)
contalitro.auto-cadastro=${AUTO_CADASTRO:true}
# Sem mensagens por esse tempo, a viagem aberta e fechada com SEM_COMUNICACAO
contalitro.inatividade=10m

# ThingsBoard (API HTTP de dispositivos)
contalitro.thingsboard.enabled=${TB_ENABLED:false}
contalitro.thingsboard.url=${TB_URL:https://thingsboard.cloud}
contalitro.thingsboard.timeout=5s

# Broker MQTT (HiveMQ). Sem MQTT_HOST o cliente nao conecta e a aplicacao sobe so com a API.
# O backend so assina: a credencial pode ser do tipo Subscribe Only.
contalitro.mqtt.enabled=true
contalitro.mqtt.host=${MQTT_HOST:}
contalitro.mqtt.port=${MQTT_PORT:8883}
contalitro.mqtt.protocolo=${MQTT_PROTOCOL:ssl}
contalitro.mqtt.usuario=${MQTT_USER:}
contalitro.mqtt.senha=${MQTT_PASSWORD:}
contalitro.mqtt.client-id=${MQTT_CLIENT_ID:contalitro-backend}
contalitro.mqtt.topico-base=contalitro
